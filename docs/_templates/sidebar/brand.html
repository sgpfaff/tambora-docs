{#- tambora brand lockup: the wordmark, the drum to its right, and the version. -#}
<a class="sidebar-brand centered" href="{{ pathto(master_doc) }}">
  {%- block brand_content %}
  <div class="tambora-brand">
    <span class="tambora-brand-word">tambora</span>
    <img class="tambora-brand-drum"
         src="{{ pathto('_static/tambora-drum.svg', 1) }}"
         alt="A Dominican tambora"/>
  </div>
  {%- if version %}
  <span class="tambora-brand-version">{{ version }}</span>
  {%- endif %}
  {% endblock brand_content %}
</a>
