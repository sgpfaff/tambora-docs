<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150" width="260" height="150"
     role="img" aria-labelledby="drumTitle drumDesc">
  <title id="drumTitle">A Dominican tambora</title>
  <desc id="drumDesc">A two-headed cylindrical merengue hand drum, played horizontally,
  with rope lacing around its wooden shell and a wooden beater stick resting beside it.</desc>

  <defs>
    <!-- wooden shell, lit from upper left -->
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c98a4b"/>
      <stop offset="28%"  stop-color="#a9642f"/>
      <stop offset="70%"  stop-color="#8a4a22"/>
      <stop offset="100%" stop-color="#6d3717"/>
    </linearGradient>
    <!-- goatskin head -->
    <radialGradient id="skin" cx="42%" cy="38%" r="72%">
      <stop offset="0%"   stop-color="#f7ecd8"/>
      <stop offset="70%"  stop-color="#e8d5b4"/>
      <stop offset="100%" stop-color="#cdb48d"/>
    </radialGradient>
    <linearGradient id="hoop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e2c188"/>
      <stop offset="50%"  stop-color="#a8842f"/>
      <stop offset="100%" stop-color="#6f5416"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d9a86a"/>
      <stop offset="100%" stop-color="#a9773f"/>
    </linearGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="126" cy="132" rx="86" ry="8" fill="#000" opacity="0.13"/>

  <!-- shell -->
  <!-- far head peeking out on the left -->
  <ellipse cx="52" cy="76" rx="15" ry="41" fill="#7a4520"/>
  <!-- cylinder body -->
  <path d="M52 35 H196 A15 41 0 0 1 196 117 H52 A15 41 0 0 1 52 35 Z" fill="url(#shell)"/>

  <!-- rope lacing: zig-zag between the two hoops -->
  <g stroke="#efe3cc" stroke-width="2.2" opacity="0.8" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <path d="M66 40 L182 52 L66 52"/>
    <path d="M182 52 L66 64 L182 64"/>
    <path d="M66 64 L182 76 L66 76"/>
    <path d="M182 76 L66 88 L182 88"/>
    <path d="M66 88 L182 100 L66 100"/>
    <path d="M182 100 L66 112 L182 112"/>
  </g>

  <!-- tension hoops at each end -->
  <ellipse cx="64" cy="76" rx="11" ry="41" fill="none" stroke="url(#hoop)" stroke-width="6"/>
  <ellipse cx="184" cy="76" rx="13" ry="41" fill="none" stroke="url(#hoop)" stroke-width="6"/>

  <!-- near drumhead -->
  <ellipse cx="196" cy="76" rx="15" ry="41" fill="url(#skin)"/>
  <ellipse cx="196" cy="76" rx="15" ry="41" fill="none" stroke="#8a6a3c" stroke-width="2.2"/>
  <!-- rim hardware -->
  <g fill="#c9a227">
    <circle cx="196" cy="37"  r="2.6"/>
    <circle cx="205" cy="58"  r="2.6"/>
    <circle cx="205" cy="94"  r="2.6"/>
    <circle cx="196" cy="115" r="2.6"/>
    <circle cx="187" cy="94"  r="2.6"/>
    <circle cx="187" cy="58"  r="2.6"/>
  </g>
  <!-- struck-head sheen -->
  <ellipse cx="193" cy="64" rx="6" ry="15" fill="#fff" opacity="0.28"/>

  <!-- palito (beater stick) -->
  <g transform="rotate(-13 120 126)">
    <rect x="66" y="122" width="112" height="7" rx="3.5" fill="url(#stick)"/>
    <rect x="66" y="122" width="112" height="2.4" rx="1.2" fill="#f0cfa0" opacity="0.55"/>
  </g>
</svg>
