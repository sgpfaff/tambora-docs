<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120"
     role="img" aria-labelledby="drumTitle drumDesc">
  <title id="drumTitle">A Dominican tambora</title>
  <desc id="drumDesc">A two-headed cylindrical merengue hand drum, played horizontally,
  with rope lacing around its wooden shell and a wooden beater stick resting beside it.</desc>

  <defs>
    <!-- wooden shell, lit from upper left -->
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c98a4b"/>
      <stop offset="28%"  stop-color="#a9642f"/>
      <stop offset="70%"  stop-color="#8a4a22"/>
      <stop offset="100%" stop-color="#6d3717"/>
    </linearGradient>
    <!-- goatskin head -->
    <radialGradient id="skin" cx="42%" cy="38%" r="72%">
      <stop offset="0%"   stop-color="#f7ecd8"/>
      <stop offset="70%"  stop-color="#e8d5b4"/>
      <stop offset="100%" stop-color="#cdb48d"/>
    </radialGradient>
    <linearGradient id="hoop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e2c188"/>
      <stop offset="50%"  stop-color="#a8842f"/>
      <stop offset="100%" stop-color="#6f5416"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#d9a86a"/>
      <stop offset="100%" stop-color="#a9773f"/>
    </linearGradient>
  </defs>

  <!-- far head peeking out behind -->
  <ellipse cx="56" cy="56" rx="13" ry="38" fill="#7a4520"/>

  <!-- shell: depth roughly equal to head diameter, as on a real tambora -->
  <path d="M56 18 H136 A13 38 0 0 1 136 94 H56 A13 38 0 0 1 56 18 Z" fill="url(#shell)"/>

  <!-- rope lacing zigzagging between the two hoops -->
  <g stroke="#efe3cc" stroke-width="2" opacity="0.8" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <path d="M69 24 L124 39 L69 39"/>
    <path d="M124 39 L69 54 L124 54"/>
    <path d="M69 54 L124 69 L69 69"/>
    <path d="M124 69 L69 84 L124 84"/>
    <path d="M69 84 L124 90 L69 90"/>
  </g>

  <!-- tension hoops at each end -->
  <ellipse cx="67" cy="56" rx="10" ry="38" fill="none" stroke="url(#hoop)" stroke-width="5.5"/>
  <ellipse cx="125" cy="56" rx="12" ry="38" fill="none" stroke="url(#hoop)" stroke-width="5.5"/>

  <!-- near drumhead -->
  <ellipse cx="136" cy="56" rx="13" ry="38" fill="url(#skin)"/>
  <ellipse cx="136" cy="56" rx="13" ry="38" fill="none" stroke="#8a6a3c" stroke-width="2.1"/>
  <!-- rim hardware -->
  <g fill="#c9a227">
    <circle cx="136" cy="20" r="2.4"/>
    <circle cx="144" cy="39" r="2.4"/>
    <circle cx="144" cy="73" r="2.4"/>
    <circle cx="136" cy="92" r="2.4"/>
    <circle cx="128" cy="73" r="2.4"/>
    <circle cx="128" cy="39" r="2.4"/>
  </g>
  <!-- struck-head sheen -->
  <ellipse cx="133" cy="45" rx="5" ry="13" fill="#fff" opacity="0.28"/>

  <!-- palito (beater stick) -->
  <g transform="rotate(-8 84 106)">
    <rect x="44" y="103" width="80" height="6" rx="3" fill="url(#stick)"/>
    <rect x="44" y="103" width="80" height="2" rx="1" fill="#f0cfa0" opacity="0.55"/>
  </g>
</svg>
