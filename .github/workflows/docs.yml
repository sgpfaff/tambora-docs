name: Build and deploy docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # tambora is a pre-release, so --pre is required.
          pip install --pre -r requirements.txt

      - name: Show versions
        run: |
          python -c "import tambora, galpy, sphinx; print('tambora', tambora.__version__); print('galpy', galpy.__version__); print('sphinx', sphinx.__version__)"

      # The notebooks that ship with committed outputs are excluded from
      # execution in conf.py; the cheap ones execute here so they can never
      # go stale against a new tambora release.
      - name: Cache notebook execution
        uses: actions/cache@v4
        with:
          path: .jupyter_cache
          key: jupyter-cache-${{ hashFiles('requirements.txt', 'docs/examples/*.ipynb') }}
          restore-keys: jupyter-cache-

      - name: Build HTML
        run: sphinx-build -b html docs docs/_build/html --fail-on-warning --keep-going

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Only publish from master, never from a pull request.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
